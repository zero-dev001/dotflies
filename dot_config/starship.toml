# Starship Prompt - Catppuccin Mocha theme
# Inspired by linkarzu/dotfiles-latest, adapted for Catppuccin palette

palette = 'catppuccin_mocha'

format = """
$os\
$username\
$hostname\
$all\
$fill\
$cmd_duration $time
$directory
$status$character
"""

[character]
success_symbol = '[>>>>](green bold)'
error_symbol = '[XXXX](red bold)'
vicmd_symbol = '[<<<<](mauve bold)'

[battery]
disabled = true

[gcloud]
disabled = true

[time]
style = 'mauve bold'
disabled = false
format = '[\[$time\]]($style) '
time_format = '%y/%m/%d'

[username]
style_user = 'mauve bold'
style_root = 'white bold'
format = '[$user]($style).@.'
show_always = true

[hostname]
ssh_only = true
format = '(white bold)[$hostname](green bold)'

[directory]
style = 'sky bold'
truncation_length = 0
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Developer" = "󰲋 "

[fill]
symbol = ' '

[os]
disabled = false
style = 'text bold'

[git_branch]
style = 'pink bold'

[git_status]
style = 'peach bold'

[git_metrics]
disabled = false
added_style = 'green bold'
deleted_style = 'red bold'

[git_commit]
style = 'lavender'
only_detached = false
tag_disabled = false
commit_hash_length = 7

[package]
style = 'peach bold'

[status]
disabled = false
style = 'red bold'
format = '[$status]($style) '

[nodejs]
style = 'green bold'

[python]
style = 'yellow bold'

[rust]
style = 'peach bold'

[golang]
style = 'sky bold'

[docker_context]
style = 'blue bold'

[kubernetes]
disabled = false
style = 'blue bold'

[cmd_duration]
style = 'yellow bold'
min_time = 2_000

[ruby]
detect_variables = []
detect_files = ['Gemfile', '.ruby-version']

